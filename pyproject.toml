[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kdomainbench"
dynamic = ["version"]
description = "Benchmark of spatial-domain number (k) estimation methods with one interface"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
dependencies = ["numpy", "pandas", "matplotlib", "scikit-learn", "anndata"]
keywords = ["spatial transcriptomics", "spatial domains", "clustering", "number of clusters", "benchmark", "Visium"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Source = "https://github.com/PYangLab/domainNumber"
Issues = "https://github.com/PYangLab/domainNumber/issues"
Changelog = "https://github.com/PYangLab/domainNumber/blob/main/CHANGELOG.md"

[project.scripts]
kdomainbench = "kdomainbench.cli:main"

[tool.setuptools.dynamic]
version = {attr = "kdomainbench.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kdomainbench = ["methods/*.py", "methods/*.R", "methods/bnpspace_R/*", "metric_scripts/*"]
