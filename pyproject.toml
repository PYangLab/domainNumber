[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kdomainbench"
version = "0.1.0"
description = "Benchmark of spatial-domain number (k) estimation methods with one interface"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "matplotlib", "scikit-learn", "anndata"]

[project.optional-dependencies]
docs = ["mkdocs==1.6.1", "mkdocs-material==9.5.50", "mkdocstrings==1.0.8", "mkdocstrings-python==2.0.10", "mkdocs-autorefs==1.4.5", "griffe==2.4.1", "pymdown-extensions==10.21.3"]  # = docs/requirements.txt

[project.scripts]
kdomainbench = "kdomainbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kdomainbench = ["methods/*.py", "methods/*.R", "methods/bnpspace_R/*"]
