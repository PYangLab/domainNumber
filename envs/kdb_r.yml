# kdomainbench: R methods (PRECAST, SC.MEB, BayesSpace, BNPSpace, DR.SC, iSC.MEB). CPU only.
# R itself plus the toolchain/system libraries; the R packages are locked in kdb_r.lock.csv and
# installed by install_r_packages.R (CRAN versions via Posit snapshots, Bioconductor 3.19).
name: kdb_r
channels:
  - conda-forge
  - nodefaults
dependencies:
  - r-base=4.4.1
  - compilers
  - make
  - cmake
  - pkg-config
  - libcurl
  - libxml2
  - openssl
  - zlib
  - hdf5
  - glpk
  - gmp
  - fftw
  - libpng
  - libjpeg-turbo
  - libtiff
  - freetype
  - fontconfig
  - harfbuzz
  - fribidi
  - libgit2
