# kdomainbench: SpatialDE2. tensorflow[and-cuda] 2.15.1 works on CPU and GPU.
# SpatialDE is pinned to upstream commit 6dbdb55. The original env was installed from a local copy of that commit
# with two edits that do not affect kdomainbench: `Literal` imported from typing_extensions, and the default
# TissueSegmentationParameters(nclasses=2) (run_spatialde.py always passes nclasses=kmax explicitly).
