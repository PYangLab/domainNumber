site_name: kDomainBench
use_directory_urls: false
site_description: Benchmarking methods that estimate the number of spatial domains (k)
repo_name: GitHub
repo_url: https://github.com/liuchunlei0430/kDomainBench
edit_uri: ""
docs_dir: docs
site_dir: site
exclude_docs: requirements.txt      # the site's own build requirements are not a page

validation:
  anchors: warn            # with --strict, a link to a heading that does not exist fails the build

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false              # Inter / Newsreader / JetBrains Mono come from stylesheets/extra.css
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.select
    - header.autohide
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle: {icon: material/weather-sunny, name: Switch to light mode}

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/vendor/gsap.min.js
  - javascripts/animations.js
  - javascripts/ui-tweaks.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: spacy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            heading_level: 2

markdown_extensions:
  - abbr
  - admonition
  - def_list
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.snippets:
      base_path: [!relative $config_dir/snippets, !relative $config_dir]   # the second for CONTRIBUTING.md, CHANGELOG.md
      check_paths: true
      auto_append: [abbreviations.md]     # hover text for the abbreviations, on every page
  - pymdownx.superfences

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Discover methods: tutorials/discover.md
      - Run a method: tutorials/run.md
      - Evaluate a run: tutorials/evaluate.md
  - Tutorials:
      - Benchmark the ten methods: tutorials/benchmark.md
  - How-to guides:
      - Your own data: how-to/own_data.md
      - Run on a cluster: how-to/cluster.md
      - Troubleshooting: how-to/troubleshooting.md
  - How kDomainBench works: overview.md
  - API reference:
      - Overview: api.md
      - Methods: reference/methods.md
      - Run: reference/run.md
      - Scores: reference/scores.md
      - Figures: reference/plot.md
      - Setup: reference/setup.md
      - Command line: reference/cli.md
  - Resources:
      - FAQ: faq.md
      - Citation: citation.md
      - Contributing: contributing.md
      - Changelog: changelog.md
