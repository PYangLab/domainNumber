site_name: kDomainBench
use_directory_urls: false
site_description: Benchmarking methods that estimate the number of spatial domains (k)
repo_name: liuchunlei0430/kDomainBench
repo_url: https://github.com/liuchunlei0430/kDomainBench
site_url: https://liuchunlei0430.github.io/kDomainBench/
edit_uri: ""
docs_dir: docs
site_dir: site

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false              # Inter / Newsreader / JetBrains Mono come from stylesheets/extra.css
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.tabs.link
    - header.autohide
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle: {icon: material/weather-night, name: Switch to dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle: {icon: material/weather-sunny, name: Switch to light mode}

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/vendor/gsap.min.js
  - javascripts/vendor/ScrollTrigger.min.js
  - javascripts/animations.js
  - javascripts/ui-tweaks.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            docstring_section_style: spacy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            separate_signature: true
            show_signature_annotations: true
            merge_init_into_class: true
            heading_level: 2

markdown_extensions:
  - admonition
  - def_list
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.snippets: {base_path: [snippets], check_paths: true}
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Get started:
      - Installation: installation.md
      - Quickstart: quickstart.md
      - Discover methods: guide/discover.md
      - Run a method: guide/run.md
      - Evaluate a run: guide/evaluate.md
      - Load and plot results: guide/plot.md
  - Tutorials:
      - tutorials/index.md
      - Benchmark the ten methods: tutorials/benchmark.md
      - CPU versus GPU: tutorials/cpu_vs_gpu.md
  - How kDomainBench works: methods.md
  - API reference:
      - api.md
      - Methods: reference/methods.md
      - Run: reference/run.md
      - Scores: reference/scores.md
      - Figures: reference/plot.md
      - Setup: reference/setup.md
